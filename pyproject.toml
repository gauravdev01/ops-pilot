[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-pilot"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: tests that require local external services"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 88
