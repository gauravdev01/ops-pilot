name: Ops-Pilot PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to review
        required: true
        type: string
      dry_run:
        description: Analyze without publishing a GitHub comment
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: [self-hosted, ops-pilot]
    steps:
      - name: Check out trusted base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ops-Pilot PR review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODEL_PROVIDER: local
          MODEL_NAME: ${{ vars.OPS_PILOT_MODEL || 'qwen2.5:7b' }}
        run: >-
          python -m app.pr_reviewer
          --pull-request
          ${{ inputs.pull_request_number || github.event.pull_request.number }}
          --repo ${{ github.repository }}
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
